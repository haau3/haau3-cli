# Dependabot keeps the toolchain current: one grouped npm PR every Monday, each major alone, grouped
# security fixes, one GitHub Actions PR a month, all waiting three days after a release (pnpm's
# minimumReleaseAge is the same three days). A maintainer merges every PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # @types/node tracks the oldest Node the command line supports (22), so its types never offer an
      # API a supported Node lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 ships no compiler API, which typescript-eslint calls.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
