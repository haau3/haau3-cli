name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Node ${{ matrix.node }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every Node line the command line supports (engines: >=22), on each system it runs on.
        node: ["22", "24", "26"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The session store's tests use each system's own credential store, under a name of their own.
      HAAU3_TEST_OS_STORE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: A Secret Service keyring to test against (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          # A password makes the daemon create the login keyring, the default collection items go to.
          # With an empty one it creates none, and every write finds no collection.
          printf 'ci-only-keyring' | gnome-keyring-daemon --daemonize --components=secrets --unlock
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: The packed package runs the way npx runs it
        run: pnpm check:bin

  checks:
    name: Types, lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check:package
